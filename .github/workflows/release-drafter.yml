name: Release Drafter

# Documented in README.md.
on:
  workflow_call:

jobs:
  update_release_draft:
    name: Auto draft releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PineappleEmperor/release-flow
          ref: ${{ github.job_workflow_sha }}
          path: .release-flow
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - id: pin
        name: Supply a version where nothing else can resolve one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # One full release is all it takes for release-drafter to resolve on its own, so
          # ask for exactly that and stop. `--limit 1` over a filtered list answers it with
          # no window: counting through an unfiltered list would need a bound, and any
          # bound is a repository with more candidates than that waiting to be wrong.
          FULL=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [ -n "$FULL" ]; then
            V=""
          else
            V=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease,publishedAt \
              | python3 .release-flow/scripts/draft_version.py)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        id: drafter
        if: github.event_name == 'push'
        with:
          version: ${{ steps.pin.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        name: Resolve the version being released
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RESOLVED: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            V="${RELEASE_TAG#v}"
          else
            V="$RESOLVED"
          fi
          if [ -z "$V" ]; then
            echo "::error::no version resolved; a PR label with a semver-increment is required"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - id: notes
        name: Generate notes grouped by commit type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PINNED: ${{ steps.pin.outputs.version }}
        run: |
          PREV=$(gh release list --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease == false and .tagName != "v" + env.V)) | .[0].tagName // ""')
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            PREV_ARG=(--previous "$PREV")
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
            PREV_ARG=()
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          BASE_V=$(python3 .release-flow/scripts/draft_version.py --base "$V")
          gh release view "v$BASE_V" >/dev/null 2>&1 \
            || gh release create "v$BASE_V" --draft --title "v$BASE_V" --notes "pending"
          RC_TAG=""
          if [ -z "${RELEASE_TAG:-}" ] || [ "$V" != "$BASE_V" ]; then
            RC_TAG=$(gh release list --limit 50 --json tagName,isDraft \
              --jq "[.[] | select(.isDraft and (.tagName | startswith(\"v${BASE_V}rc\"))) | .tagName] | first // empty")
            if [ -z "$RC_TAG" ]; then
              N=1
              while gh release view "v${BASE_V}rc${N}" >/dev/null 2>&1; do N=$((N + 1)); done
              RC_TAG="v${BASE_V}rc${N}"
              gh release create "$RC_TAG" --draft --prerelease --title "$RC_TAG" --notes "pending"
            fi
          fi
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="v$V" -f previous_tag_name="$PREV" --jq .body > gh_notes.md \
            || : > gh_notes.md
          python3 .release-flow/scripts/release_notes.py \
            --range "$RANGE" \
            --repo-url "https://github.com/$GH_REPO" \
            "${PREV_ARG[@]}" --version "$V" \
            --github-notes-file gh_notes.md > notes.md
          gh release edit "v$V" --notes-file notes.md
          [ "v$V" = "v$BASE_V" ] || gh release edit "v$BASE_V" --notes-file notes.md
          [ -z "$RC_TAG" ] || gh release edit "$RC_TAG" --notes-file notes.md

          if [ -n "${RELEASE_TAG:-}" ]; then
            RULE=(--published "$RELEASE_TAG")
          else
            RULE=(--drafting "$BASE_V")
            [ -z "${PINNED:-}" ] || RULE+=(--pinned)
          fi
          set -o pipefail
          gh release list --limit 1000 --json tagName,isDraft \
            | python3 .release-flow/scripts/draft_version.py --stale-drafts "${RULE[@]}" \
            | while read -r stale; do
                echo "::notice::removing superseded draft $stale"
                gh release delete "$stale" --yes
              done

      - name: Release notes render correctly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.ver.outputs.version }}
          PREV: ${{ steps.notes.outputs.previous }}
        run: |
          FIRST=()
          [ -n "$PREV" ] || FIRST=(--first-release)
          python3 .release-flow/scripts/check_release_notes.py --tag "v$V" --version "$V" "${FIRST[@]}"
