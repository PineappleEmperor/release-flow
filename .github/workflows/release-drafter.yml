name: Release Drafter

# Documented in README.md.
on:
  workflow_call:

jobs:
  update_release_draft:
    name: Auto draft releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PineappleEmperor/release-flow
          ref: ${{ github.job_workflow_sha }}
          path: .release-flow
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        id: drafter
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        name: Resolve the version being released
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RESOLVED: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            V="${RELEASE_TAG#v}"
          else
            V="$RESOLVED"
          fi
          if [ -z "$V" ]; then
            echo "::error::no version resolved; a PR label with a semver-increment is required"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Generate notes grouped by commit type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.ver.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PREV=$(gh release list --exclude-drafts --limit 30 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease == false and .tagName != "v" + env.V)) | .[0].tagName // ""')
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            PREV_ARG=(--previous "$PREV")
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
            PREV_ARG=()
          fi
          BASE_V=$(printf '%s' "$V" | sed -E 's/(rc|alpha|beta|a|b)[0-9]*$//I')
          gh release view "v$BASE_V" >/dev/null 2>&1 \
            || gh release create "v$BASE_V" --draft --title "v$BASE_V" --notes "pending"
          RC_TAG=$(gh release list --limit 50 --json tagName,isDraft \
            --jq "[.[] | select(.isDraft and (.tagName | startswith(\"v${BASE_V}rc\"))) | .tagName] | first // empty")
          if [ -z "$RC_TAG" ]; then
            N=1
            while gh release view "v${BASE_V}rc${N}" >/dev/null 2>&1; do N=$((N + 1)); done
            RC_TAG="v${BASE_V}rc${N}"
            gh release create "$RC_TAG" --draft --prerelease --title "$RC_TAG" --notes "pending"
          fi
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="v$V" -f previous_tag_name="$PREV" --jq .body > gh_notes.md \
            || : > gh_notes.md
          python3 .release-flow/scripts/release_notes.py \
            --range "$RANGE" \
            --repo-url "https://github.com/$GH_REPO" \
            "${PREV_ARG[@]}" --version "$V" \
            --github-notes-file gh_notes.md > notes.md
          gh release edit "v$V" --notes-file notes.md
          [ "v$V" = "v$BASE_V" ] || gh release edit "v$BASE_V" --notes-file notes.md
          gh release edit "$RC_TAG" --notes-file notes.md

          if [ -n "${RELEASE_TAG:-}" ] && ! echo "$V" | grep -Eiq 'rc[0-9]*$'; then
            gh release list --limit 50 --json tagName,isDraft \
              --jq ".[] | select(.isDraft and (.tagName | startswith(\"v${BASE_V}\"))) | .tagName" \
              | while read -r stale; do
                  echo "::notice::removing superseded draft $stale"
                  gh release delete "$stale" --yes
                done
          fi

      - name: Release notes render correctly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          python3 .release-flow/scripts/check_release_notes.py --tag "v$V" --version "$V"
