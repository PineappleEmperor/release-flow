# Copy to .github/workflows/pr-checks.yml in the consuming repository.
# The all-zeros SHA is a placeholder: README.md, "The pointers".
name: PR Checks

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: PineappleEmperor/release-flow/.github/workflows/pr-checks.yml@0000000000000000000000000000000000000000 # v1.0.0
