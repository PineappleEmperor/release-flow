# Copy to .github/workflows/auto-draft-pr.yml in the consuming repository.
# The all-zeros SHA is a placeholder: README.md, "The pointers".
name: Draft PR

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  draft:
    uses: PineappleEmperor/release-flow/.github/workflows/auto-draft-pr.yml@0000000000000000000000000000000000000000 # v1.0.0
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
